server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Nunca servir arquivos de controle ou de configuração.
    location ~ /\.(git|env|DS_Store) { return 404; }
    location ~ ^/(Dockerfile|docker-compose\.ya?ml|publicar/) { return 404; }

    # Fotos têm o nome pelo conteúdo: o navegador pode guardar para sempre.
    # (add_header aqui substitui os de baixo, por isso se repetem.)
    location /fotos/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # A página sempre confere se há versão nova (atualização aparece na hora).
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
}
